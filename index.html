<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四向Pad节点连线系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            max-width: 1000px;
        }

        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            line-height: 1.6;
            color: #b8c1ec;
        }

        .controls {
            background-color: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 1000px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .control-group label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .control-group input, .control-group select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 1rem;
            width: 180px;
            transition: all 0.3s;
        }

        .control-group input:focus, .control-group select:focus {
            outline: none;
            border-color: #00dbde;
            box-shadow: 0 0 10px rgba(0, 219, 222, 0.3);
        }

        

        .add-node-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.03);
            border: none;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
            margin: 0;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(120, 119, 198, 0.1) 0%, transparent 55%),
                radial-gradient(circle at 75% 75%, rgba(255, 119, 198, 0.1) 0%, transparent 55%);
            cursor: default;
            z-index: 1;
        }

        .container.dragging {
            cursor: grabbing;
        }

        .node {
            position: absolute;
            width: 140px;
            height: 100px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            user-select: none;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            z-index: 10;
            text-align: center;
            padding: 10px;
            cursor: move;
            backdrop-filter: blur(5px);
            transition: none; /* 去掉过渡动画 */
        }

        .node:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .node.active {
            filter: drop-shadow(0 0 15px rgba(0, 255, 100, 0.7));
            box-shadow: 0 0 25px rgba(0, 255, 100, 0.5);
        }

        .node.highlight {
            filter: drop-shadow(0 0 20px rgba(0, 255, 100, 1));
            box-shadow: 0 0 30px rgba(0, 255, 100, 0.7);
            animation: pulse 1.5s infinite;
        }

        .node.selected {
            box-shadow: 0 0 0 3px #00dbde, 0 0 20px rgba(0, 219, 222, 0.7);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(0, 255, 100, 0.7); }
            50% { box-shadow: 0 0 30px rgba(0, 255, 100, 1); }
            100% { box-shadow: 0 0 20px rgba(0, 255, 100, 0.7); }
        }

        .node-port {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            cursor: crosshair;
            transition: all 0.2s;
            z-index: 11;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #333;
            text-align: center;
            padding: 2px;
        }

        .node-port:hover {
            box-shadow: 0 0 15px rgba(0, 255, 100, 0.8);
        }

        .node-port.disabled {
            background-color: #666 !important;
            cursor: not-allowed !important;
            box-shadow: 0 0 5px rgba(100, 100, 100, 0.5) !important;
        }

        .port-top {
            top: -12px;
            transform: translateX(-50%) rotate(90deg);
            transform-origin: center center;
        }
        .port-top::after {
            content: attr(data-content);
            position: absolute;
            font-size: 12px;
            left: 40px;
            min-width: 20px;
        }

        .port-right {
            right: -12px;
        }
        .port-right::after {
            content: '浮空';
            position: absolute;
            right: 40px;
            min-width: 20px;
        }

        .port-bottom {
            bottom: -12px;
        }

        .port-left {
            left: -12px;
        }

        .delete-node {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 24px;
            height: 24px;
            padding: 0;
            background: #ff4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            z-index: 12;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .node:hover .delete-node {
            opacity: 1;
        }

        .delete-node:hover {
            background: #ff0000;
            transform: scale(1.1);
        }

        .hide-delete-btn .delete-node {
            display: none;
        }

        .canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        #connectionCanvas {
            width: 100%;
            height: 100%;
        }

        .connection-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 100;
            color: white;
            min-width: 200px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .connection-controls h3 {
            margin-bottom: 10px;
            color: #00dbde;
        }

        .status {
            position: absolute;
            top: 16px;
            left: 16px;
            max-width: 360px;
            text-align: left;
            font-size: 0.95rem;
            padding: 12px 16px;
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #b8c1ec;
            z-index: 50;
        }

        .instructions {
            max-width: 1000px;
            margin-top: 20px;
            text-align: center;
            line-height: 1.6;
            opacity: 0.9;
            color: #b8c1ec;
        }

        .instructions h3 {
            color: #00dbde;
            margin-bottom: 10px;
        }

        .instructions ul {
            list-style-position: inside;
            margin-top: 10px;
            text-align: left;
            display: inline-block;
        }

        .instructions li {
            margin-bottom: 8px;
            padding-left: 10px;
        }

        .connection-info {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .connection-line {
            stroke-width: 3;
            stroke-linecap: round;
            fill: none;
        }

        .dragging-line {
            stroke-width: 3;
            stroke-dasharray: 5, 5;
            stroke-linecap: round;
            fill: none;
            animation: dash 1s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -20;
            }
        }

        .connection-count {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            padding: 10px;
            color: white;
            font-size: 0.9rem;
            z-index: 20;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .selection-rectangle {
            position: absolute;
            border: 2px dashed #00dbde;
            background-color: rgba(0, 219, 222, 0.2);
            pointer-events: none;
            z-index: 1000;
        }

        .file-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .file-input {
            display: none;
        }

        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s;
        }

        .zoom-btn:hover {
            background: rgba(0, 219, 222, 0.7);
            transform: scale(1.1);
        }

        .zoom-level {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 5px 10px;
            text-align: center;
            font-size: 0.9rem;
            color: white;
        }
        /* ===== IC 封装芯片本体 ===== */
    .node.chip {
        background: #2b3245;
        border: 2px solid #4b5670;
    }

    /* 超级扁平小封装（SOP2 等 2pin 转换器）：体内显示名称（小字体，超长省略），不再隐藏 */
    .node.chip.flat {
        font-size: 9px;
        line-height: 1.05;
        padding: 0 3px;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    /* ===== 长方形引脚（Pin） ===== */
    .node-port.pin {
        background-color: #334155;
        color: #e2e8f0;
        border: 1px solid #4b5670;
        border-radius: 3px;
        box-shadow: 0 0 6px rgba(0,0,0,0.4);
        white-space: nowrap;
        overflow: visible;
        font-size: 10px;
        font-weight: 600;
        padding: 0;
        line-height: 1;
    }
    .node-port.pin::after { display: none !important; }
    .node-port.pin.port-top {
        top: -17px; transform: translateX(-50%);
        width: 18px; height: 34px;
    }
    .node-port.pin.port-bottom {
        bottom: -17px; transform: translateX(-50%);
        width: 18px; height: 34px;
    }
    .node-port.pin.port-left {
        left: -17px; transform: translateY(-50%);
        width: 34px; height: 18px;
    }
    .node-port.pin.port-right {
        right: -17px; transform: translateY(-50%);
        width: 34px; height: 18px;
    }
    .node-port.pin:hover {
        background-color: #fff;
        box-shadow: 0 0 12px rgba(0, 255, 100, 0.8);
    }
    .node-port.pin.pin-assigned {
        background-color: #f59e0b;
        color: #fff7ed;
        text-shadow: 0 1px 2px rgba(0,0,0,0.55);
        box-shadow: 0 0 10px rgba(245, 158, 11, 0.9);
    }
    /* 电源引脚（VDD / VSS 等，无复用功能） */
    .node-port.pin.pin-power {
        background-color: #b45309;
        color: #fff7ed;
        border-color: #f59e0b;
    }
    .node-port.pin.pin-power:hover {
        background-color: #d97706;
    }
    /* 总线类引脚（外设 SPI 信号脚：CS / MISO / MOSI / CLK …）特殊标记 */
    .node-port.pin.pin-bus {
        background-color: #0ea5e9;
        color: #fff;
        border: 2px solid #38bdf8;
        box-shadow: 0 0 8px rgba(56, 189, 248, 0.7);
    }
    .node-port.pin.pin-bus:hover {
        background-color: #0284c7;
    }
    /* 预制设备引脚若具备总线复用能力（可配 SPI/I2C…），加细蓝边提示 */
    .node-port.pin.pin-buscap {
        border: 1px solid rgba(56, 189, 248, 0.55);
    }
    /* 连线拖拽中：高亮"具备该总线功能"的候选 IO */
    .node-port.pin.pin-bus-target {
        background-color: #38bdf8 !important;
        color: #fff !important;
        border: 2px solid #0ea5e9 !important;
        box-shadow: 0 0 0 3px #38bdf8, 0 0 16px rgba(56, 189, 248, 0.95) !important;
        z-index: 5;
    }
    .node-port.pin.disabled {
        background-color: #555 !important;
        color: #999 !important;
        box-shadow: none !important;
        cursor: not-allowed !important;
    }

    /* ===== 封装工具栏分组视觉 ===== */
    .package-controls, .io-controls, .device-controls, .peripheral-controls {
        border-left: 1px solid rgba(255,255,255,0.15);
        padding-left: 18px;
    }
    .device-controls select, .peripheral-controls select {
        background: #2a3550;
        color: #e8eefc;
        border: 1px solid #4b5670;
        border-radius: 6px;
        padding: 5px 8px;
    }

    /* ===== Dock 说明弹出面板（自定义 HTML 内容） ===== */
    .dock-help-panel {
        position: fixed;
        z-index: 2000;
        display: none;
        max-width: 440px;
        max-height: 72vh;
        overflow-y: auto;
        background: rgba(20, 24, 38, 0.97);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        box-shadow: 0 12px 44px rgba(0, 0, 0, 0.55);
        color: #cbd5e1;
        padding: 0;
    }
    .dock-help-panel.show { display: block; }
    .dock-help-panel .dh-head {
        position: sticky;
        top: 0;
        background: rgba(20, 24, 38, 0.99);
        padding: 12px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        font-weight: 600;
        color: #00dbde;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .dock-help-panel .dh-close {
        cursor: pointer;
        color: #94a3b8;
        font-size: 1.1rem;
        padding: 0 6px;
        line-height: 1;
    }
    .dock-help-panel .dh-close:hover { color: #fff; }
    .dock-help-panel .dh-body {
        padding: 14px 18px 18px;
        line-height: 1.6;
        font-size: 0.9rem;
    }
    .dock-help-panel ul { list-style: none; margin: 0; padding: 0; }
    .dock-help-panel li { margin-bottom: 8px; padding-left: 14px; position: relative; }
    .dock-help-panel li::before { content: '•'; position: absolute; left: 0; color: #00dbde; }
    .dock-help-panel strong { color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="connection-controls">
            <h3>连接状态</h3>
            <div id="connectionStatus">未连接</div>
            <div class="connection-info" id="connectionInfo">点击任意Pad开始连接</div>
        </div>

        <div class="status" id="statusInfo">
            准备就绪 - 点击任意节点的Pad并拖动到其他节点Pad创建连接
        </div>

        <div class="connection-count" id="connectionCount">
            连接数: 0
        </div>

        <div class="zoom-controls">
            <div class="zoom-btn" id="zoomIn">+</div>
            <div class="zoom-level" id="zoomLevel">100%</div>
            <div class="zoom-btn" id="zoomOut">-</div>
            <div class="zoom-btn" id="zoomReset">↺</div>
        </div>
    </div>

    <!-- 隐藏的文件输入（供 dock 弹出菜单触发） -->
    <input type="file" id="fileInput" class="file-input" accept=".json">
    <input type="file" id="favFileInput" class="file-input" accept=".json">
    <input type="file" id="configFileInput" class="file-input" accept=".json,application/json">
    <input type="file" id="svdJsonFileInput" class="file-input" accept=".json,application/json">
    <input type="file" id="svdFilesInput" class="file-input" accept=".svd,.sfd" multiple>
    <input type="file" id="workspaceFileInput" class="file-input" accept=".json,application/json">

    <!-- 顶部 Dock 栏容器（由 dock.js + main.js 渲染） -->
    <div id="dockHost"></div>

    <!-- 说明弹出面板（dock "说明"项触发，内容由 JS 注入） -->
    <div id="helpPanel" class="dock-help-panel"></div>

    <script src="config.bundle.js"></script>
    <script src="js/config.js"></script>
    <script src="rich-menu.js"></script>
    <script src="js/node.js"></script>
    <script src="js/packages.js"></script>
    <script src="js/af-menu.js"></script>
    <script src="js/system.js"></script>
    <script src="dock.js"></script>
    <script src="CIU32F003x5.js"></script>
    <script src="svd2js.js"></script>
    <script src="js/svd-lib.js"></script>
    <script src="macwindow.js"></script>
    <script src="js/swd.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/comm.js"></script>
    <script src="js/ide.js"></script>
    <script src="excel.js"></script>
    <script src="tools/swd-var-menu.js"></script>
    <script src="rich-obj-editor.js"></script>
    <script src="tools/control-panel.js"></script>
    <script src="tools/demo-control-panel.js"></script>
    <script src="tools/layout-window.js"></script>
    <script src="chart.js"></script>
    <script src="tools/preview-window.js"></script>
    <script src="tools/panel-workbench.js"></script>
    <script src="tools/panel-runtime.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
